server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
        - id: auction-service
          uri: lb://auction-service
          predicates:
            - Path=/api/v1/auctions/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
      # Dev-only CORS: allows any localhost origin/port (the FE dev server's exact port
      # isn't fixed yet) so browser-based requests from the frontend aren't blocked.
      # allowedOriginPatterns (not allowedOrigins) is required here because
      # allowCredentials=true forbids the literal wildcard "*" origin.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "http://localhost:*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Must match user-service's nexus.security.jwt.secret exactly — the gateway verifies
# the same signature user-service signed with. In a real deployment this value comes
# from a shared secret store, not a hardcoded default; acceptable for local dev only.
nexus:
  security:
    jwt:
      secret: "dev-only-secret-key-change-in-production-min-256-bits-long!!"

management:
  endpoints:
    web:
      exposure:
        include: health,info
